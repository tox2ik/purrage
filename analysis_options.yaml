include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - windows/**

linter:
  rules:
    # A future nobody awaits is a failure nobody hears: wrap a deliberate one in
    # `unawaited(...)` so it is visibly a choice.
    - unawaited_futures
    - discarded_futures
    - prefer_final_locals
    - always_declare_return_types
    - avoid_void_async
