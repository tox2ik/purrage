name: ci

# The app ships on Windows, but nothing in lib/ or test/ needs a window: the
# seams in state/ fake the process, the environment and the file system, so the
# same suite runs headless on both runners. Linux is the cheap gate that catches
# a stray backslash; Windows is the platform it actually ships on, and the one
# that knows what a drive letter and a CRLF are. release.yml builds the .exe.

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: flutter test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      # One platform going red must not hide the other's answer.
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: flutter version
        run: flutter --version

      - name: dependencies
        run: flutter pub get

      # The suite shells out to real `git` in throwaway repos, so the runner's
      # git has to be there and has to be able to commit.
      - name: git identity for the temp repos
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "purrage ci"

      # 32 deprecated_member_use infos come from the Flutter 3.50 rename of
      # package:flutter/material.dart; they are not ours to fix in this change,
      # so infos are allowed and warnings/errors still fail the build.
      - name: analyze
        run: flutter analyze --no-fatal-infos

      # dart_test.yaml sets a 22s per-test timeout, which is generous on a dev
      # box and tight on a shared runner; the CLI flag wins over the file.
      - name: test
        run: flutter test --timeout 60s
